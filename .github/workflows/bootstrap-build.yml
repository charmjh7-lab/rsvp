name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate adaptive launcher foreground
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_launcher_icons.py

      - name: Commit generated launcher foreground
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/res/drawable-nodpi/ic_launcher_foreground_bitmap.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res/drawable-nodpi/ic_launcher_foreground_bitmap.png
            git commit -m "Generate PNG adaptive launcher foreground"
            git push origin HEAD:main
          fi

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RSVP-Reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
