name: Eye Reader Debug APK

on:
  push:
    branches: [ main, development/eye-movement ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: eye-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel superseded Eye Reader builds
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {owner: context.repo.owner, repo: context.repo.repo,
               branch: 'development/eye-movement', per_page: 100});
            for (const run of runs) {
              if (run.id !== context.runId && run.id < context.runId
                  && ['queued', 'in_progress'].includes(run.status)
                  && ['Android Debug APK', 'Eye Reader Debug APK'].includes(run.name)) {
                await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner,
                  repo: context.repo.repo, run_id: run.id});
              }
            }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Eye-Reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Keep latest Eye Reader artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner: context.repo.owner, repo: context.repo.repo, per_page: 100});
            for (const artifact of artifacts) {
              if (['Eye-Reader-debug-apk'].includes(artifact.name)
                  && artifact.workflow_run?.id !== context.runId) {
                await github.rest.actions.deleteArtifact({owner: context.repo.owner,
                  repo: context.repo.repo, artifact_id: artifact.id});
              }
            }
