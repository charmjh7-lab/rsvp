name: Bootstrap source and build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat .bootstrap/source.part* > /tmp/rsvp-source.b64
          base64 -d /tmp/rsvp-source.b64 > /tmp/rsvp-source.zip
          rm -rf /tmp/rsvp-src
          mkdir -p /tmp/rsvp-src
          unzip -q /tmp/rsvp-source.zip -d /tmp/rsvp-src
          rsync -a /tmp/rsvp-src/RSVP-Reader-Android/ ./
          rm -rf .bootstrap

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import RSVP Reader Android source [skip ci]"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RSVP-Reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
